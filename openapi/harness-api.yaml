          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 4000}
                revised_objective: {type: string, maxLength: 4000}
                model_route:
                  enum: [same, escalate_terra]
                additional_token_budget: {type: integer, minimum: 0, maximum: 100000000}
      responses:
        '202':
          description: New immutable attempt created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks/{taskId}/request-review:
    post:
      tags: [Tasks]
      operationId: requestTaskReview
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Independent verifier queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /tasks/{taskId}/validate/{validatorId}:
    post:
      tags: [Tasks]
      operationId: runTaskValidator
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/ValidatorId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Validator completed with controller-custodied output.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationOutcome'}
        '409': {$ref: '#/components/responses/Conflict'}
  /agents/{agentId}:
    get:
      tags: [Agents]
      operationId: getAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200':
          description: Agent session and current thread/turn.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
  /agents/{agentId}/steer:
    post:
      tags: [Agents]
      operationId: steerAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 12000}
                update_goal: {type: boolean, default: false}
      responses:
        '202':
          description: Steering accepted for delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /agents/{agentId}/interrupt:
    post:
      tags: [Agents]
      operationId: interruptAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Interrupt requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /agents/{agentId}/activity:
    get:
      tags: [Agents]
      operationId: listAgentActivity
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - name: after
          in: query
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        '200':
          description: Projected activity page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityPage'}
  /approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      parameters:
        - name: state
          in: query
          schema: {enum: [pending, resolved, expired]}
        - name: run_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Approval requests.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Approval'}
  /approvals/{approvalId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApproval
      parameters:
        - {$ref: '#/components/parameters/ApprovalId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {enum: [accept, decline, cancel, approve_once, deny]}
                note: {type: string, maxLength: 4000}
                expected_version: {type: integer, minimum: 1}
      responses:
        '202':
          description: Decision recorded and queued for runtime delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '409': {$ref: '#/components/responses/Conflict'}
  /worktrees:
    get:
      tags: [Worktrees]
      operationId: listWorktrees
      parameters:
        - name: run_id
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Managed worktrees.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Worktree'}
  /worktrees/{worktreeId}/preserve:
    post:
      tags: [Worktrees]
      operationId: preserveWorktree
      parameters:
        - {$ref: '#/components/parameters/WorktreeId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 4000}
      responses:
        '200':
          description: Worktree preservation updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Worktree'}
  /worktrees/{worktreeId}/diff:
    get:
      tags: [Worktrees]
      operationId: getWorktreeDiffSummary
      parameters:
        - {$ref: '#/components/parameters/WorktreeId'}
      responses:
        '200':
          description: Live Git state and bounded changed-file summary for a managed worktree.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiffSummary'}
  /runs/{runId}/evidence:
    get:
      tags: [Evidence]
      operationId: listRunEvidence
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Evidence and claim matrix.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceSummary'}
  /runs/{runId}/evidence/export:
    post:
      tags: [Evidence]
      operationId: exportRunEvidence
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                include_full_command_logs: {type: boolean, default: false}
      responses:
        '202':
          description: Export operation accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /runs/{runId}/usage:
    get:
      tags: [Usage]
      operationId: getRunUsage
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Usage and API-equivalent cost summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
  /usage:
    get:
      tags: [Usage]
      operationId: getUsageBreakdown
      responses:
        '200':
          description: Usage grouped by Codex account, repository, and agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageBreakdown'}
  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      description: Durable Server-Sent Events stream. Use Last-Event-ID or `cursor` to resume.
      parameters:
        - name: cursor
          in: query
          schema: {type: integer, minimum: 0}
        - name: run_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: text/event-stream with durable event IDs.
          content:
            text/event-stream:
              schema: {type: string}
  /improvement/outcomes:
    get:
      tags: [Improvement]
      operationId: listOutcomeVector
      parameters:
        - name: run_id
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      responses:
        '200':
          description: Redacted current outcome vector; conflicting heads remain visible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutcomeVector'}
    post:
      tags: [Improvement]
      operationId: recordOperatorOutcome
      description: Only an operator assertion may be submitted. Automated sources are resolved server-side from typed records.
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordOperatorOutcomeRequest'}
      responses:
        '201':
          description: Sanitized operator action and append-only outcome revision recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutcomeRevisionReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /improvement/outcomes/{outcomeId}:
    get:
      tags: [Improvement]
      operationId: getOutcomeHistory
      parameters:
        - name: outcomeId
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      responses:
        '200':
          description: Redacted append-only revision history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutcomeHistory'}
        '404': {$ref: '#/components/responses/NotFound'}
  /improvement/failures:
    get:
      tags: [Improvement]
      operationId: listFailureOverview
      description: Read-only, redacted failure-cluster overview for one repository.
      parameters:
        - name: repository_id
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
      responses:
        '200':
          description: Durable failure observations and bounded cluster summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FailureOverview'}
  /improvement/traces/{traceId}:
    get:
      tags: [Improvement]
      operationId: getFailureTrace
      description: Read-only redacted TraceV2 node summaries and linked outcome vector. Raw payloads are never returned.
      parameters:
        - name: traceId
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
      responses:
        '200':
          description: Redacted trace summary with outcomes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FailureTrace'}
        '404': {$ref: '#/components/responses/NotFound'}
  /improvement/evaluations/runs/{evaluationRunId}:
    get:
      tags: [Improvement]
      operationId: getEvaluationRun
      description: Receipt-only evaluation run summary. It never returns executor inputs or evidence payloads.
      parameters:
        - name: evaluationRunId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      responses:
        '200': {description: Closed evaluation run receipt., content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationRunSummary'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /improvement/evaluations/samples/{sampleId}:
    get:
      tags: [Improvement]
      operationId: getEvaluationSample
      description: Receipt-only evaluation sample summary. Evidence and artifact payloads are never returned.
      parameters:
        - name: sampleId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      responses:
        '200': {description: Closed evaluation sample receipt., content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationSampleSummary'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /improvement/evaluations/cases/{caseRevisionId}:
    get:
      tags: [Improvement]
      operationId: getEvaluationCase
      description: Immutable evaluation-case receipt summary; fixture locator, objective, setup and command bodies are excluded.
      parameters:
        - name: caseRevisionId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      responses:
        '200': {description: Closed immutable evaluation case receipt., content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationCaseSummary'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /improvement/evaluations/occurrences/{occurrenceId}:
    get:
      tags: [Improvement]
      operationId: getEvaluationOccurrenceSource
      description: Controller-derived source receipt for a known failure occurrence; this does not materialize or execute a case.
      parameters:
        - name: occurrenceId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      responses:
        '200': {description: Closed occurrence source receipt., content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationOccurrenceSource'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    LocalSession:
      type: apiKey
      in: cookie
      name: harness_session
  parameters:
    CsrfToken:
      name: X-Harness-CSRF
      in: header
      required: true
      schema: {type: string, minLength: 16}
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: {type: string}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
    ValidatorId:
      name: validatorId
      in: path
      required: true
      schema: {type: string}
    AgentId:
      name: agentId
      in: path
      required: true
      schema: {type: string}
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: {type: string}
    WorktreeId:
      name: worktreeId
      in: path
      required: true
      schema: {type: string}
    AttentionId:
      name: attentionId
      in: path
      required: true
      schema: {type: string, maxLength: 160}
    AccountId:
      name: accountId
      in: path
      required: true
      schema: {type: string}
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State or optimistic-concurrency conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: Request or profile validation error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    SnapshotSection:
      type: object
      additionalProperties: false
      required: [state, rows, source_cursor, truncated, detail]
      properties:
        state: {enum: [current, stale, unknown, error]}
        rows: {type: array, maxItems: 1000, items: {}}
        source_cursor: {type: integer, minimum: 0}
        truncated: {type: boolean}
        detail: {type: [string, 'null']}
    SnapshotTruncation:
      type: object
      additionalProperties: false
      required: [section, omitted_rows, limit]
      properties:
        section: {type: string}
        omitted_rows: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 0}
    ControlPlaneSnapshot:
      type: object
      additionalProperties: false
      required: [schema, snapshot_id, revision, compiled_at_ms, event_cursor, consistency, system, accounts, scheduler, runs, attention, attempts, investigations, progress, liveness, reconciliation, external_conditions, cost, notifications, limits, truncation, source_cursors, sha256]
      properties:
        schema: {const: harness.control-plane-snapshot.v1}
        snapshot_id: {type: string}
        revision: {type: integer, minimum: 1}
        compiled_at_ms: {type: integer}
        event_cursor: {type: integer, minimum: 0}
        consistency: {type: string}
        system: {$ref: '#/components/schemas/SnapshotSection'}
        accounts: {$ref: '#/components/schemas/SnapshotSection'}
        scheduler: {$ref: '#/components/schemas/SnapshotSection'}
        runs: {$ref: '#/components/schemas/SnapshotSection'}
        attention: {$ref: '#/components/schemas/SnapshotSection'}
        attempts: {$ref: '#/components/schemas/SnapshotSection'}
        investigations: {$ref: '#/components/schemas/SnapshotSection'}
        progress: {$ref: '#/components/schemas/SnapshotSection'}
        liveness: {$ref: '#/components/schemas/SnapshotSection'}
        reconciliation: {$ref: '#/components/schemas/SnapshotSection'}
        external_conditions: {$ref: '#/components/schemas/SnapshotSection'}
        cost: {$ref: '#/components/schemas/SnapshotSection'}
        notifications: {$ref: '#/components/schemas/SnapshotSection'}
        limits: {$ref: '#/components/schemas/SnapshotSection'}
        truncation: {type: array, items: {$ref: '#/components/schemas/SnapshotTruncation'}}
        source_cursors: {type: object, additionalProperties: {type: integer, minimum: 0}}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    MaterialProgressEvent:
      type: object
      additionalProperties: false
      required: [schema, event_id, run_id, task_id, attempt_id, kind, source_event_id, occurred_at_ms, classifier_version, summary, evidence_refs, candidate_sha, milestone_refs, sha256]
      properties:
        schema: {const: harness.material-progress.v1}
        event_id: {type: string, maxLength: 160}
        run_id: {type: [string, 'null'], maxLength: 160}
        task_id: {type: [string, 'null'], maxLength: 160}
        attempt_id: {type: [string, 'null'], maxLength: 160}
        kind: {enum: [candidate_changed, validation_advanced, evidence_recorded, external_condition_changed, reconciliation_advanced, attention_changed]}
        source_event_id: {type: string, maxLength: 160}
        occurred_at_ms: {type: integer, minimum: 0}
        classifier_version: {type: string, maxLength: 160}
        summary: {type: string, maxLength: 4000}
        evidence_refs: {type: array, maxItems: 1000, items: {type: string, maxLength: 4000}}
        candidate_sha: {type: [string, 'null'], pattern: '^[0-9a-fA-F]{40}$'}
        milestone_refs: {type: array, maxItems: 100, items: {type: string, maxLength: 4000}}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    LivenessEpisode:
      type: object
      additionalProperties: false
      required: [schema, episode_id, run_id, task_id, attempt_id, state, version, opened_at_ms, updated_at_ms, state_reason_codes, last_material_progress_at_ms, next_review_at_ms, intervention_count, outcome, sha256]
      properties:
        schema: {const: harness.liveness-episode.v1}
        episode_id: {type: string, maxLength: 160}
        run_id: {type: [string, 'null'], maxLength: 160}
        task_id: {type: [string, 'null'], maxLength: 160}
        attempt_id: {type: [string, 'null'], maxLength: 160}
        state: {enum: [healthy, quiet_active, waiting_external, degraded, suspected_stall, confirmed_stall, ownership_uncertain, recovery_required, terminal]}
        version: {type: integer, minimum: 1}
        opened_at_ms: {type: integer, minimum: 0}
        updated_at_ms: {type: integer, minimum: 0}
        state_reason_codes: {type: array, maxItems: 32, items: {type: string, maxLength: 160}}
        last_material_progress_at_ms: {type: [integer, 'null'], minimum: 0}
        next_review_at_ms: {type: [integer, 'null'], minimum: 0}
        intervention_count: {type: integer, minimum: 0}
        outcome: {type: [string, 'null'], maxLength: 160}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    InterventionReceipt:
      type: object
      additionalProperties: false
      required: [schema, intervention_id, episode_id, kind, source_event_id, target_version, policy_version, requested_by, created_at_ms, sha256]
      properties:
        schema: {const: harness.intervention-receipt.v1}
        intervention_id: {type: string, maxLength: 160}
        episode_id: {type: string, maxLength: 160}
        kind: {enum: [wait, pause_for_operator, request_operator_decision, request_reconciliation, queue_read_only_review]}
        source_event_id: {type: string, maxLength: 160}
        target_version: {type: integer, minimum: 1}
        policy_version: {type: string, maxLength: 160}
        requested_by: {type: string, maxLength: 160}
        created_at_ms: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    ExecuteWaitInterventionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    PauseSchedulerForLivenessEpisodeRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    TraceContext:
      type: object
      additionalProperties: false
      required: [trace_id, span_id, parent_span_id]
      properties:
        trace_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        span_id: {type: string, pattern: '^[0-9a-f]{16}$'}
        parent_span_id: {type: [string, 'null'], pattern: '^[0-9a-f]{16}$'}
    CorrelationLink:
      type: object
      additionalProperties: false
      required: [schema, link_id, trace, from_kind, from_id, to_kind, to_id, relation, created_at_ms]
      properties:
        schema: {const: harness.correlation-link.v1}
        link_id: {type: string, maxLength: 160}
        trace: {$ref: '#/components/schemas/TraceContext'}
        from_kind: {type: string, maxLength: 160}
        from_id: {type: string, maxLength: 160}
        to_kind: {type: string, maxLength: 160}
        to_id: {type: string, maxLength: 160}
        relation: {type: string, maxLength: 160}
        created_at_ms: {type: integer, minimum: 0}
    ReconciliationEpisode:
      type: object
      additionalProperties: false
      required: [schema, episode_id, run_id, trigger_kind, state, version, opened_at_ms, updated_at_ms, source_event_id, inventory_sha256, finding_count, action_count, report, sha256]
      properties:
        schema: {const: harness.reconciliation-episode.v1}
        episode_id: {type: string, maxLength: 160}
        run_id: {type: [string, 'null'], maxLength: 160}
        trigger_kind: {enum: [daemon_restart, app_server_loss, process_loss, version_transition, account_handoff, worktree_mismatch, uncertain_command_completion]}
        state: {enum: [open, claimed, awaiting_evidence, resolved, refused]}
        version: {type: integer, minimum: 1}
        opened_at_ms: {type: integer, minimum: 0}
        updated_at_ms: {type: integer, minimum: 0}
        source_event_id: {type: string, maxLength: 160}
        inventory_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        finding_count: {type: integer, minimum: 0}
        action_count: {type: integer, minimum: 0}
        report: {type: [string, 'null'], maxLength: 4000}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    ReconciliationFinding:
      type: object
      additionalProperties: false
      required: [schema, episode_id, kind, source_event_id, observed_at_ms, payload, sha256]
      properties:
        schema: {const: harness.reconciliation-finding.v1}
        episode_id: {$ref: '#/components/schemas/OpaqueId'}
        kind: {enum: [live_owner, unknown_owner, preserved_candidate, stale_approval, ambiguous_external_effect]}
        source_event_id: {$ref: '#/components/schemas/OpaqueId'}
        observed_at_ms: {type: integer, minimum: 0}
        payload: {type: object, additionalProperties: true, maxProperties: 128}
        sha256: {$ref: '#/components/schemas/Digest'}
    ReconciliationActionReceipt:
      type: object
      additionalProperties: false
      required: [schema, episode_id, kind, source_event_id, authority_event_id, created_at_ms, payload, sha256]
      properties:
        schema: {const: harness.reconciliation-action-receipt.v1}
        episode_id: {$ref: '#/components/schemas/OpaqueId'}
        kind: {enum: [preserve, resume_proven_owner, invalidate_stale_approval, release_proven_dead_lease, authorize_fresh_attempt, open_attention]}
        source_event_id: {$ref: '#/components/schemas/OpaqueId'}
        authority_event_id:
          anyOf:
            - {$ref: '#/components/schemas/OpaqueId'}
            - {type: 'null'}
        created_at_ms: {type: integer, minimum: 0}
        payload: {type: object, additionalProperties: true, maxProperties: 128}
        sha256: {$ref: '#/components/schemas/Digest'}
    TopologyNode:
      type: object
      additionalProperties: false
      required: [id, kind, source_ref]
      properties:
        id: {type: string, maxLength: 176}
        kind: {type: string, maxLength: 160}
        source_ref: {type: string, maxLength: 160}
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [from, to, kind, source_ref]
      properties:
        from: {type: string, maxLength: 176}
        to: {type: string, maxLength: 176}
        kind: {type: string, maxLength: 160}
        source_ref: {type: string, maxLength: 160}
    TopologySnapshot:
      type: object
