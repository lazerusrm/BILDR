openapi: 3.1.0
info:
  title: BILDR local API
  version: 1.0.0-draft
  description: >-
    Localhost-only API for the BILDR UI and harnessctl. This contract
    does not expose Codex App Server directly; harnessd projects it into durable
    repository/run/task/agent/evidence resources.
servers:
  - url: http://127.0.0.1:7310/api/v1
security:
  - LocalSession: []
tags:
  - name: Runtime
  - name: Repositories
  - name: Runs
  - name: Tasks
  - name: Agents
  - name: Approvals
  - name: Worktrees
  - name: Evidence
  - name: Usage
  - name: Events
  - name: Improvement
  - name: ControlPlane
  - name: Attention
  - name: Investigations
  - name: ExternalConditions
  - name: Progress
  - name: Liveness
  - name: Reconciliation
  - name: Notifications
paths:
  /health:
    get:
      tags: [Runtime]
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Process health; not execution readiness.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /session:
    post:
      tags: [Runtime]
      security: []
      operationId: createLocalSession
      responses:
        '201':
          description: Creates an HttpOnly same-origin session and returns its CSRF token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalSession'}
  /runtime:
    get:
      tags: [Runtime]
      operationId: getRuntime
      responses:
        '200':
          description: Runtime and App Server readiness.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeStatus'}
  /codex/accounts:
    get:
      tags: [Runtime]
      operationId: listCodexAccounts
      responses:
        '200':
          description: Detected local Codex homes and live telemetry for the selected account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
  /codex/accounts/{accountId}/select:
    post:
      tags: [Runtime]
      operationId: selectCodexAccount
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Selected account and refreshed live telemetry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
        '409': {$ref: '#/components/responses/Conflict'}
  /codex/accounts/login:
    post:
      tags: [Runtime]
      operationId: startCodexAccountLogin
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartCodexAccountLoginRequest'}
      responses:
        '200':
          description: Device authorization instructions from the installed Codex binary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountLoginStatus'}
        '409': {$ref: '#/components/responses/Conflict'}
  /codex/accounts/login/{loginId}:
    get:
      tags: [Runtime]
      operationId: getCodexAccountLoginStatus
      parameters:
        - name: loginId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current device authorization state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountLoginStatus'}
  /codex/accounts/login/{loginId}/cancel:
    post:
      tags: [Runtime]
      operationId: cancelCodexAccountLogin
      parameters:
        - name: loginId
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Device authorization cancellation requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountLoginStatus'}
  /codex/accounts/{accountId}/rename:
    post:
      tags: [Runtime]
      operationId: renameCodexAccount
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameCodexAccountRequest'}
      responses:
        '200':
          description: Account friendly name updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
  /codex/accounts/{accountId}/remove:
    post:
      tags: [Runtime]
      operationId: removeCodexAccount
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Harness-managed account credentials removed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
        '409': {$ref: '#/components/responses/Conflict'}
  /repositories:
    get:
      tags: [Repositories]
      operationId: listRepositories
      responses:
        '200':
          description: Registered repositories.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Repository'}
    post:
      tags: [Repositories]
      operationId: registerRepository
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRepositoryRequest'}
      responses:
        '201':
          description: Repository registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /repositories/discover:
    get:
      tags: [Repositories]
      operationId: discoverRepositories
      responses:
        '200':
          description: Bounded local Git checkout discovery results.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RepositoryDiscovery'}
  /repositories/{repositoryId}:
    get:
      tags: [Repositories]
      operationId: getRepository
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
      responses:
        '200':
          description: Repository details and health.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings:
    get:
      tags: [Runtime]
      operationId: getOperatorSettings
      responses:
        '200':
          description: Effective local operator settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorSettings'}
    post:
      tags: [Runtime]
      operationId: updateOperatorSettings
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOperatorSettingsRequest'}
      responses:
        '200':
          description: Updated effective local operator settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorSettings'}
  /repositories/{repositoryId}/inspect:
    post:
      tags: [Repositories]
      operationId: inspectRepository
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Inspection started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /repositories/{repositoryId}/prepare-clean-checkout:
    post:
      tags: [Repositories]
      operationId: prepareCoordinationCheckout
      description: Create and verify a clean coordination checkout, then replace an unused blocked registration without changing the source checkout.
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrepareCoordinationCheckoutRequest'}
      responses:
        '200':
          description: Registration updated to the verified clean checkout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /control-plane/snapshot:
    get:
      tags: [ControlPlane]
      operationId: getControlPlaneSnapshot
      responses:
        '200':
          description: An immutable snapshot compiled from exact bounded source cursors.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlPlaneSnapshot'}
  /control-plane/return-view:
    get:
      tags: [ControlPlane]
      operationId: getControlPlaneReturnView
      responses:
        '200':
          description: Return-focused presentation from one immutable snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReturnView'}
  /control-plane/return-view/cursor:
    post:
      tags: [ControlPlane]
      operationId: advanceReturnViewCursor
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdvanceReturnViewCursorRequest'}
      responses:
        '200':
          description: Presentation acknowledgement cursor advanced without resolving any source item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReturnViewCursor'}
        '409': {$ref: '#/components/responses/Conflict'}
  /material-progress:
    get:
      tags: [Progress]
      operationId: listMaterialProgress
      description: Deterministic, immutable material-progress records from the closed controller-event classifier. Ordinary output, tokens, and command activity are excluded.
      parameters:
        - name: run_id
          in: query
          schema: {type: string, maxLength: 160}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first material progress records.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MaterialProgressEvent'}}
  /liveness:
    get:
      tags: [Liveness]
      operationId: listLivenessEpisodes
      description: Observe-only deterministic liveness episodes. This endpoint does not collect, clear, recover, or execute anything.
      parameters:
        - name: run_id
          in: query
          schema: {type: string, maxLength: 160}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first liveness episode views.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LivenessEpisode'}}
  /runs/{runId}/liveness:
    get:
      tags: [Liveness]
      operationId: listRunLivenessEpisodes
      description: Observe-only liveness episodes for one exact run. This endpoint cannot initiate recovery or retry work.
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first liveness episode views for the selected run.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LivenessEpisode'}}
  /liveness/{episodeId}/interventions:
    get:
      tags: [Liveness]
      operationId: listInterventionReceipts
      description: Immutable receipts for interventions already performed through a controller-owned path. This endpoint cannot request, replay, or apply an intervention.
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {type: string, maxLength: 160}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first immutable intervention receipts for one exact liveness episode.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/InterventionReceipt'}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Liveness]
      operationId: executeWaitIntervention
      description: "Records the one active low-risk intervention: a revision-bound wait decision. It cannot clear a stall or change task, attempt, owner, worktree, process, approval, or external-condition custody."
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {type: string, maxLength: 160}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecuteWaitInterventionRequest'}
      responses:
        '200':
          description: The liveness episode after exactly one immutable wait receipt was recorded. Replaying the same authenticated session and revision is idempotent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivenessEpisode'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /liveness/{episodeId}/interventions/pause-scheduler:
    post:
      tags: [Liveness]
      operationId: pauseSchedulerForLivenessEpisode
      description: "Atomically pauses only the scheduler for the exact run bound to a confirmed-stall or recovery-required liveness episode. The exact revision, local-session audit row, scheduler update, and immutable receipt commit together; it cannot retry, resume, release, or alter an attempt."
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {type: string, maxLength: 160}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseSchedulerForLivenessEpisodeRequest'}
      responses:
        '200':
          description: The liveness episode after exactly one immutable pause-for-operator receipt was recorded. Replaying the same session and revision is idempotent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivenessEpisode'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /liveness/{episodeId}/knowledge-candidates:
    post:
      tags: [Liveness, Knowledge]
      operationId: proposeKnowledgeFromRepeatedLiveness
      description: Creates an unreviewed display-only heuristic from exactly two independently recovered liveness episodes in one repository. The controller derives the bounded factual statement, immutable observation receipts, scope repository, freshness, sensitivity, and identity; this endpoint cannot activate knowledge or write prompt memory.
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {type: string, maxLength: 160}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposeKnowledgeFromLivenessRequest'}
      responses:
        '200':
          description: Idempotent unreviewed candidate with exactly four immutable liveness observation receipts. It is never active or injected into task context by this operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivenessKnowledgeCandidate'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /traces/{traceId}:
    get:
      tags: [ControlPlane]
      operationId: listCorrelationLinks
      description: Bounded immutable causal-link receipts for one exact trace. This endpoint cannot create links, start work, or expose raw event payloads.
      parameters:
        - name: traceId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 8192, default: 50}
      responses:
        '200':
          description: Stable, bounded causal-link receipts for the trace. An unknown trace returns an empty list.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CorrelationLink'}}
  /runs/{runId}/topology:
    get:
      tags: [ControlPlane]
      operationId: getRunTopology
      description: Bounded factual run/task/attempt/agent/worktree ownership and dependency table. Graph layout and controller actions are deliberately absent.
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Immutable digest-checked topology compiled at one run event cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopologySnapshot'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reconciliations:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationEpisodes
      description: Read-only controller inventory records. Listing cannot apply a recovery, reset a worktree, release a lease, or authorize replacement work.
      parameters:
        - name: run_id
          in: query
          schema: {type: string, maxLength: 160}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first reconciliation episode records.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ReconciliationEpisode'}}
  /reconciliations/{episodeId}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationEpisode
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      responses:
        '200':
          description: One immutable-custody checked reconciliation episode.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationEpisode'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reconciliations/{episodeId}/findings:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationFindings
      description: Immutable controller-recorded reconciliation inventory facts. Listing cannot apply, retry, release, or reset any custody.
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first immutable findings for one exact reconciliation episode.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ReconciliationFinding'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /reconciliations/{episodeId}/actions:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationActionReceipts
      description: Immutable receipts for actions already performed by a controller path. This route cannot request, replay, or apply recovery.
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first immutable reconciliation action receipts for one exact episode.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ReconciliationActionReceipt'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /reconciliations/{episodeId}/knowledge-candidates:
    post:
      tags: [Reconciliation, Knowledge]
      operationId: proposeKnowledgeFromRepeatedReconciliation
      description: Creates an unreviewed display-only warning from exactly two independently preserved reconciliation episodes with the same trigger in one repository. The controller derives immutable episode receipts, factual statement, scope repository, freshness, sensitivity, and identity. Preservation is not recovery or replacement authority; this endpoint cannot retry a task, activate knowledge, or write prompt memory.
      parameters:
        - name: episodeId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposeKnowledgeFromReconciliationRequest'}
      responses:
        '200':
          description: Idempotent unreviewed candidate with exactly two immutable reconciliation episode receipts. It is never active or injected into task context by this operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationKnowledgeCandidate'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /operator-presence:
    get:
      tags: [Notifications]
      operationId: getOperatorPresence
      responses:
        '200':
          description: The authenticated session's explicit presentation preference; it does not change controller authority or notification delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorPresence'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Notifications]
      operationId: setOperatorPresence
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetOperatorPresenceRequest'}
      responses:
        '200':
          description: Explicit version-checked creation or update of the authenticated session's presentation preference; delivery remains mirror-only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorPresence'}
        '409': {$ref: '#/components/responses/Conflict'}
  /notification-deliveries:
    get:
      tags: [Notifications]
      operationId: listNotificationDeliveries
      description: Immutable pending in-product presentation claims. A claim never resolves or suppresses its source attention item.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first pending presentation claims.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/NotificationDelivery'}}
  /notification-deliveries/{delivery_id}/presentations:
    post:
      tags: [Notifications]
      operationId: recordNotificationPresentation
      description: Records one exact authenticated product-surface presentation of a pending claim. This cannot acknowledge, close, defer, suppress, retry, or otherwise alter source attention.
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema: {type: string, maxLength: 160}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordNotificationPresentationRequest'}
      responses:
        '200':
          description: Idempotent immutable presentation receipt scoped to the authenticated session-derived operator identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPresentationReceipt'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /notification-shadow-batches:
    get:
      tags: [Notifications]
      operationId: listNotificationShadowBatches
      description: Bounded immutable shadow-only notification plans. They compare a complete snapshot and exact local presence revision with the existing pending in-product claims; they cannot defer, suppress, send, or resolve a source.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Bounded newest-first immutable shadow plans.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/NotificationShadowBatch'}}
    post:
      tags: [Notifications]
      operationId: createNotificationShadowBatch
      description: Records an exact snapshot-bound comparison plan after verifying every pending in-product claim. The plan is evidence only and fails closed on a truncated attention snapshot; it cannot alter delivery timing or source state.
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNotificationShadowBatchRequest'}
      responses:
        '200':
          description: Idempotent immutable shadow plan with complete attention coverage.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationShadowBatch'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /notification-delivery-health:
    get:
      tags: [Notifications]
      operationId: getNotificationDeliveryHealth
      description: Bounded integrity-checked health for current attention revisions. This read does not refresh, batch, suppress, send, or resolve a notification source.
      responses:
        '200':
          description: Mirror-only delivery health. Counters are limited to examined revisions and are not a whole-system guarantee when truncated is true.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationDeliveryHealth'}
  /attention:
    get:
      tags: [Attention]
      operationId: listAttention
      parameters:
        - name: include_terminal
          in: query
          schema: {type: boolean, default: false}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 240}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Source-owned attention items in stable server ordering.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttentionPage'}
  /attention/{attentionId}:
    get:
      tags: [Attention]
      operationId: getAttention
      parameters:
        - {$ref: '#/components/parameters/AttentionId'}
      responses:
        '200':
          description: One source-owned attention item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttentionItem'}
        '404': {$ref: '#/components/responses/NotFound'}
  /attention/{attentionId}/acknowledge:
    post:
      tags: [Attention]
      operationId: acknowledgeAttention
      description: Acknowledgement changes only presentation state. It cannot resolve or satisfy the source item.
      parameters:
        - {$ref: '#/components/parameters/AttentionId'}
