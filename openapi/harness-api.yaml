      type: string
      pattern: '^[A-Za-z0-9_.:-]{1,160}$'
    KnowledgeScope:
      type: object
      additionalProperties: false
      required: [repository_id, task_family, model_family, runtime_class]
      properties:
        repository_id: {$ref: '#/components/schemas/KnowledgeToken'}
        task_family: {$ref: '#/components/schemas/KnowledgeToken'}
        model_family:
          anyOf:
            - {$ref: '#/components/schemas/KnowledgeToken'}
