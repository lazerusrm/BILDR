openapi: 3.1.0
info:
  title: BILDR local API
  version: 1.0.0-draft
  description: >-
    Localhost-only API for the BILDR UI and harnessctl. This contract
    does not expose Codex App Server directly; harnessd projects it into durable
    repository/run/task/agent/evidence resources.
servers:
  - url: http://127.0.0.1:7310/api/v1
security:
  - LocalSession: []
tags:
  - name: Runtime
  - name: Repositories
  - name: Runs
  - name: Tasks
  - name: Agents
  - name: Approvals
  - name: Worktrees
  - name: Evidence
  - name: Usage
  - name: Events
paths:
  /health:
    get:
      tags: [Runtime]
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Process health; not execution readiness.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /session:
    post:
      tags: [Runtime]
      security: []
      operationId: createLocalSession
      responses:
        '201':
          description: Creates an HttpOnly same-origin session and returns its CSRF token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalSession'}
  /runtime:
    get:
      tags: [Runtime]
      operationId: getRuntime
      responses:
        '200':
          description: Runtime and App Server readiness.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeStatus'}
  /codex/accounts:
    get:
      tags: [Runtime]
      operationId: listCodexAccounts
      responses:
        '200':
          description: Detected local Codex homes and live telemetry for the selected account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
  /codex/accounts/{accountId}/select:
    post:
      tags: [Runtime]
      operationId: selectCodexAccount
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Selected account and refreshed live telemetry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
        '409': {$ref: '#/components/responses/Conflict'}
  /codex/accounts/login:
    post:
      tags: [Runtime]
      operationId: startCodexAccountLogin
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartCodexAccountLoginRequest'}
      responses:
        '200':
          description: Device authorization instructions from the installed Codex binary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountLoginStatus'}
        '409': {$ref: '#/components/responses/Conflict'}
  /codex/accounts/login/{loginId}:
    get:
      tags: [Runtime]
      operationId: getCodexAccountLoginStatus
      parameters:
        - name: loginId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current device authorization state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountLoginStatus'}
  /codex/accounts/login/{loginId}/cancel:
    post:
      tags: [Runtime]
      operationId: cancelCodexAccountLogin
      parameters:
        - name: loginId
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Device authorization cancellation requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountLoginStatus'}
  /codex/accounts/{accountId}/rename:
    post:
      tags: [Runtime]
      operationId: renameCodexAccount
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameCodexAccountRequest'}
      responses:
        '200':
          description: Account friendly name updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
  /codex/accounts/{accountId}/remove:
    post:
      tags: [Runtime]
      operationId: removeCodexAccount
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Harness-managed account credentials removed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodexAccountsSnapshot'}
        '409': {$ref: '#/components/responses/Conflict'}
  /repositories:
    get:
      tags: [Repositories]
      operationId: listRepositories
      responses:
        '200':
          description: Registered repositories.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Repository'}
    post:
      tags: [Repositories]
      operationId: registerRepository
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRepositoryRequest'}
      responses:
        '201':
          description: Repository registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /repositories/discover:
    get:
      tags: [Repositories]
      operationId: discoverRepositories
      responses:
        '200':
          description: Bounded local Git checkout discovery results.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RepositoryDiscovery'}
  /repositories/{repositoryId}:
    get:
      tags: [Repositories]
      operationId: getRepository
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
      responses:
        '200':
          description: Repository details and health.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings:
    get:
      tags: [Runtime]
      operationId: getOperatorSettings
      responses:
        '200':
          description: Effective local operator settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorSettings'}
    post:
      tags: [Runtime]
      operationId: updateOperatorSettings
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateOperatorSettingsRequest'}
      responses:
        '200':
          description: Updated effective local operator settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorSettings'}
  /repositories/{repositoryId}/inspect:
    post:
      tags: [Repositories]
      operationId: inspectRepository
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Inspection started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /repositories/{repositoryId}/prepare-clean-checkout:
    post:
      tags: [Repositories]
      operationId: prepareCoordinationCheckout
      description: Create and verify a clean coordination checkout, then replace an unused blocked registration without changing the source checkout.
      parameters:
        - {$ref: '#/components/parameters/RepositoryId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrepareCoordinationCheckoutRequest'}
      responses:
        '200':
          description: Registration updated to the verified clean checkout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repository'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      parameters:
        - name: repository_id
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
    post:
      tags: [Runs]
      operationId: createRun
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '201':
          description: Prepared or preparing run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Full run summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/start-architecture:
    post:
      tags: [Runs]
      operationId: startArchitecture
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Architect session queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/interview/start:
    post:
      tags: [Runs]
      operationId: startIntentInterview
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: The first read-only interview turn started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/interview/respond:
    post:
      tags: [Runs]
      operationId: respondToIntentInterview
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 12000}
      responses:
        '202':
          description: A new turn started on the existing interview thread.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs/{runId}/interview/confirm:
    post:
      tags: [Runs]
      operationId: confirmIntentInterview
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [brief_digest]
              properties:
                brief_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '202':
          description: The brief was confirmed and architecture started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/interview/skip:
    post:
      tags: [Runs]
      operationId: skipIntentInterview
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: The optional interview was skipped and architecture started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/plan/approve:
    post:
      tags: [Runs]
      operationId: approvePlan
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_graph_digest]
              properties:
                task_graph_digest: {type: string}
                note: {type: string, maxLength: 4000}
                allow_budget_override:
                  type: boolean
                  default: false
                  description: Explicit local-user override when the remaining run ceiling is below the controller execution reserve.
      responses:
        '202':
          description: Scheduling enabled for approved graph.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/plan/request_changes:
    post:
      tags: [Runs]
      operationId: requestPlanChanges
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_graph_digest, findings]
              properties:
                task_graph_digest: {type: string}
                summary: {type: string, maxLength: 4000}
                findings:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {$ref: '#/components/schemas/PlanReviewFinding'}
      responses:
        '202':
          description: Human findings entered the durable revision loop and a replacement plan was queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/scheduler/pause:
    post:
      tags: [Runs]
      operationId: pauseRunScheduler
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Scheduler paused.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
  /runs/{runId}/scheduler/resume:
    post:
      tags: [Runs]
      operationId: resumeRunScheduler
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                additional_token_budget:
                  type: integer
                  minimum: 0
                  maximum: 100000000
                  description: Optional governor allowance for the resumed window; zero uses the adaptive recommendation. Bounded child-thread headroom is reserved separately.
      responses:
        '202':
          description: Scheduler resumed and ready tasks dispatched. If the run budget was exhausted, the selected or adaptive governor allowance plus bounded child-thread headroom is added first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
  /runs/{runId}/stop:
    post:
      tags: [Runs]
      operationId: stopRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  enum: [after_current_commands, interrupt_turns, cancel]
                preserve_all_worktrees: {type: boolean, default: true}
      responses:
        '202':
          description: Updated terminal or stopping run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
  /runs/{runId}/archive:
    post:
      tags: [Runs]
      operationId: archiveRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Terminal run archived; durable history and worktrees remain preserved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/approve-integration:
    post:
      tags: [Runs]
      operationId: approveIntegration
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_head_sha]
              properties:
                expected_head_sha: {$ref: '#/components/schemas/GitSha'}
                note: {type: string, maxLength: 4000}
      responses:
        '202':
          description: Integration validation/final audit queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/signoff/approve:
    post:
      tags: [Runs]
      operationId: approveExecutionSignoff
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_head_sha, expected_packet_digest]
              properties:
                expected_head_sha: {$ref: '#/components/schemas/GitSha'}
                expected_packet_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                note: {type: string, maxLength: 4000}
      responses:
        '202':
          description: Human signoff bound to the exact integration SHA and packet accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/signoff/request_changes:
    post:
      tags: [Runs]
      operationId: requestExecutionSignoffChanges
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_head_sha, expected_packet_digest, summary, findings]
              properties:
                expected_head_sha: {$ref: '#/components/schemas/GitSha'}
                expected_packet_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                summary: {type: string, minLength: 1, maxLength: 4000}
                findings:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {$ref: '#/components/schemas/PlanReviewFinding'}
      responses:
        '202':
          description: Findings mapped to owned tasks and a fresh integration repair cycle queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/signoff/acceptance/{acceptanceId}/attest:
    post:
      tags: [Runs]
      operationId: attestPlatformAcceptance
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - name: acceptanceId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_head_sha, expected_packet_digest, target_identity, observations]
              properties:
                expected_head_sha: {$ref: '#/components/schemas/GitSha'}
                expected_packet_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                target_identity: {type: string, minLength: 2, maxLength: 500}
                observations: {type: string, minLength: 8, maxLength: 4000}
      responses:
        '202':
          description: Signed local-user acceptance evidence recorded against the exact integration SHA.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/publish-draft-pr:
    post:
      tags: [Runs]
      operationId: publishDraftPr
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_head_sha, title]
              properties:
                expected_head_sha: {$ref: '#/components/schemas/GitSha'}
                title: {type: string, minLength: 1, maxLength: 240}
                body_appendix: {type: string, maxLength: 20000}
      responses:
        '202':
          description: Explicit external publication operation accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/draft-pr/refresh-ci:
    post:
      tags: [Runs]
      operationId: refreshDraftPrCi
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Required draft-PR checks refreshed; passing exact-head checks promote tasks through CI_PROVEN.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/tasks:
    get:
      tags: [Tasks]
      operationId: listRunTasks
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Tasks and attempts.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Task'}
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
      responses:
        '200':
          description: Task detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tasks/{taskId}/retry:
    post:
      tags: [Tasks]
      operationId: retryTask
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 4000}
                revised_objective: {type: string, maxLength: 4000}
                model_route:
                  enum: [same, escalate_terra]
                additional_token_budget: {type: integer, minimum: 0, maximum: 100000000}
      responses:
        '202':
          description: New immutable attempt created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks/{taskId}/request-review:
    post:
      tags: [Tasks]
      operationId: requestTaskReview
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Independent verifier queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /tasks/{taskId}/validate/{validatorId}:
    post:
      tags: [Tasks]
      operationId: runTaskValidator
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {$ref: '#/components/parameters/ValidatorId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Validator completed with controller-custodied output.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationOutcome'}
        '409': {$ref: '#/components/responses/Conflict'}
  /agents/{agentId}:
    get:
      tags: [Agents]
      operationId: getAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      responses:
        '200':
          description: Agent session and current thread/turn.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
  /agents/{agentId}/steer:
    post:
      tags: [Agents]
      operationId: steerAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 12000}
                update_goal: {type: boolean, default: false}
      responses:
        '202':
          description: Steering accepted for delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
  /agents/{agentId}/interrupt:
    post:
      tags: [Agents]
      operationId: interruptAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '202':
          description: Interrupt requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /agents/{agentId}/activity:
    get:
      tags: [Agents]
      operationId: listAgentActivity
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - name: after
          in: query
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        '200':
          description: Projected activity page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityPage'}
  /approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      parameters:
        - name: state
          in: query
          schema: {enum: [pending, resolved, expired]}
        - name: run_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Approval requests.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Approval'}
  /approvals/{approvalId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApproval
      parameters:
        - {$ref: '#/components/parameters/ApprovalId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {enum: [accept, decline, cancel, approve_once, deny]}
                note: {type: string, maxLength: 4000}
                expected_version: {type: integer, minimum: 1}
      responses:
        '202':
          description: Decision recorded and queued for runtime delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '409': {$ref: '#/components/responses/Conflict'}
  /worktrees:
    get:
      tags: [Worktrees]
      operationId: listWorktrees
      parameters:
        - name: run_id
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Managed worktrees.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Worktree'}
  /worktrees/{worktreeId}/preserve:
    post:
      tags: [Worktrees]
      operationId: preserveWorktree
      parameters:
        - {$ref: '#/components/parameters/WorktreeId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 4000}
      responses:
        '200':
          description: Worktree preservation updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Worktree'}
  /worktrees/{worktreeId}/diff:
    get:
      tags: [Worktrees]
      operationId: getWorktreeDiffSummary
      parameters:
        - {$ref: '#/components/parameters/WorktreeId'}
      responses:
        '200':
          description: Live Git state and bounded changed-file summary for a managed worktree.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiffSummary'}
  /runs/{runId}/evidence:
    get:
      tags: [Evidence]
      operationId: listRunEvidence
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Evidence and claim matrix.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceSummary'}
  /runs/{runId}/evidence/export:
    post:
      tags: [Evidence]
      operationId: exportRunEvidence
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                include_full_command_logs: {type: boolean, default: false}
      responses:
        '202':
          description: Export operation accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
  /runs/{runId}/usage:
    get:
      tags: [Usage]
      operationId: getRunUsage
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Usage and API-equivalent cost summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
  /usage:
    get:
      tags: [Usage]
      operationId: getUsageBreakdown
      responses:
        '200':
          description: Usage grouped by Codex account, repository, and agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageBreakdown'}
  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      description: Durable Server-Sent Events stream. Use Last-Event-ID or `cursor` to resume.
      parameters:
        - name: cursor
          in: query
          schema: {type: integer, minimum: 0}
        - name: run_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: text/event-stream with durable event IDs.
          content:
            text/event-stream:
              schema: {type: string}
components:
  securitySchemes:
    LocalSession:
      type: apiKey
      in: cookie
      name: harness_session
  parameters:
    CsrfToken:
      name: X-Harness-CSRF
      in: header
      required: true
      schema: {type: string, minLength: 16}
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema: {type: string}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
    ValidatorId:
      name: validatorId
      in: path
      required: true
      schema: {type: string}
    AgentId:
      name: agentId
      in: path
      required: true
      schema: {type: string}
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: {type: string}
    WorktreeId:
      name: worktreeId
      in: path
      required: true
      schema: {type: string}
    AccountId:
      name: accountId
      in: path
      required: true
      schema: {type: string}
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State or optimistic-concurrency conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: Request or profile validation error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    GitSha:
      type: string
      pattern: '^[0-9a-f]{40}$'
    Health:
      type: object
      additionalProperties: false
      required: [status, version, uptime_seconds, time]
      properties:
        status: {const: ok}
        version: {type: string}
        uptime_seconds: {type: integer, minimum: 0}
        time: {type: integer}
    LocalSession:
      type: object
      additionalProperties: false
      required: [csrf_token, expires_at_ms]
      properties:
        csrf_token: {type: string, minLength: 16}
        expires_at_ms: {type: integer}
    RuntimeStatus:
      type: object
      additionalProperties: false
      required: [daemon, codex, database, scheduler]
      properties:
        daemon: {$ref: '#/components/schemas/ComponentStatus'}
        codex: {$ref: '#/components/schemas/CodexRuntime'}
        database: {$ref: '#/components/schemas/ComponentStatus'}
        scheduler: {$ref: '#/components/schemas/SchedulerStatus'}
    ComponentStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {enum: [ready, degraded, unavailable, disabled]}
        detail: {type: string}
    CodexRuntime:
      allOf:
        - {$ref: '#/components/schemas/ComponentStatus'}
        - type: object
          properties:
            version: {type: string}
            required_version: {type: string}
            protocol_schema_sha256: {type: string}
            schema_match: {type: boolean}
            pid: {type: integer}
            restart_count: {type: integer}
    SchedulerStatus:
      type: object
      additionalProperties: false
      required: [paused, active_total, max_total, active_mutable, max_mutable, active_verifiers, max_verifiers, queued_tasks]
      properties:
        paused: {type: boolean}
        active_total: {type: integer}
        max_total: {type: integer}
        active_mutable: {type: integer}
        max_mutable: {type: integer}
        active_verifiers: {type: integer}
        max_verifiers: {type: integer}
        queued_tasks: {type: integer}
    CodexAccountsSnapshot:
      type: object
      additionalProperties: false
      required: [selected_account_id, accounts]
      properties:
        selected_account_id: {type: [string, 'null']}
        accounts:
          type: array
          items: {$ref: '#/components/schemas/CodexAccountProfile'}
    CodexAccountProfile:
      type: object
      additionalProperties: false
      required: [id, label, codex_home, selected, state, account_type, email, plan_type, rate_limits, observed_at, detail, managed]
      properties:
        id: {type: string}
        label: {type: string}
        codex_home: {type: string}
        selected: {type: boolean}
        state: {enum: [detected, ready, signed_out, unavailable]}
        account_type: {type: [string, 'null']}
        email: {type: [string, 'null']}
        plan_type: {type: [string, 'null']}
        rate_limits:
          type: array
          items: {$ref: '#/components/schemas/CodexRateLimit'}
        observed_at: {type: [integer, 'null']}
        detail: {type: [string, 'null']}
        managed: {type: boolean}
    StartCodexAccountLoginRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 1, maxLength: 60}
        account_id: {type: [string, 'null']}
    RenameCodexAccountRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 1, maxLength: 60}
    CodexAccountLoginStatus:
      type: object
      additionalProperties: false
      required: [id, label, state, verification_url, user_code, detail]
      properties:
        id: {type: string}
        label: {type: string}
        state: {enum: [waiting_for_user, completed, failed, canceling, canceled]}
        verification_url: {type: [string, 'null'], format: uri}
        user_code: {type: [string, 'null']}
        detail: {type: [string, 'null']}
    CodexRateLimit:
      type: object
      additionalProperties: false
      required: [limit_id, limit_name, plan_type, windows]
      properties:
        limit_id: {type: string}
        limit_name: {type: [string, 'null']}
        plan_type: {type: [string, 'null']}
        windows:
          type: array
          items: {$ref: '#/components/schemas/CodexRateLimitWindow'}
    CodexRateLimitWindow:
      type: object
      additionalProperties: false
      required: [kind, used_percent, remaining_percent, window_duration_mins, resets_at]
      properties:
        kind: {enum: [primary, secondary]}
        used_percent: {type: integer, minimum: 0, maximum: 100}
        remaining_percent: {type: integer, minimum: 0, maximum: 100}
        window_duration_mins: {type: [integer, 'null'], minimum: 0}
        resets_at: {type: [integer, 'null']}
    RegisterRepositoryRequest:
      type: object
      additionalProperties: false
      required: [profile_id, root_path]
      properties:
        profile_id: {type: string}
        root_path: {type: string}
        expected_origin: {type: string}
    PrepareCoordinationCheckoutRequest:
      type: object
      additionalProperties: false
      required: [destination_path]
      properties:
        destination_path:
          type: string
          description: Absolute path for a new directory that does not already exist.
    RepositoryDiscovery:
      type: object
      additionalProperties: false
      required: [root_path, display_name, is_github, compatible, registered]
      properties:
        root_path: {type: string}
        display_name: {type: string}
        origin_url: {type: string}
        is_github: {type: boolean}
        compatible: {type: boolean}
        registered: {type: boolean}
    OperatorSettings:
      type: object
      additionalProperties: false
      required: [store_reasoning_summaries, store_raw_reasoning, yolo_mode, allow_automatic_external_writes, automatic_external_writes_locked, automatic_account_handoff, adaptive_governor_budgets, automatic_governor_continuation, automatic_plan_approval, governor_goal_token_budget, governor_attempt_token_ceiling, recommended_governor_attempt_tokens, governor_budget_sample_count, governor_budget_reason]
      properties:
        store_reasoning_summaries: {type: boolean}
        store_raw_reasoning: {type: boolean}
        yolo_mode: {type: boolean}
        allow_automatic_external_writes: {type: boolean}
        automatic_external_writes_locked: {type: boolean}
        automatic_account_handoff: {type: boolean}
        adaptive_governor_budgets: {type: boolean}
        automatic_governor_continuation: {type: boolean}
        automatic_plan_approval: {type: boolean}
        governor_goal_token_budget: {type: integer, minimum: 500000, maximum: 1000000000}
        governor_attempt_token_ceiling: {type: integer, minimum: 400000, maximum: 100000000}
        recommended_governor_attempt_tokens: {type: integer, minimum: 400000}
        governor_budget_sample_count: {type: integer, minimum: 0}
        governor_budget_reason: {type: string}
    UpdateOperatorSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        store_reasoning_summaries: {type: boolean}
        store_raw_reasoning: {type: boolean}
        yolo_mode: {type: boolean}
        automatic_account_handoff: {type: boolean}
        adaptive_governor_budgets: {type: boolean}
        automatic_governor_continuation: {type: boolean}
        automatic_plan_approval: {type: boolean}
        governor_goal_token_budget: {type: integer, minimum: 500000, maximum: 1000000000}
        governor_attempt_token_ceiling: {type: integer, minimum: 400000, maximum: 100000000}
    Repository:
      type: object
      additionalProperties: false
      required: [id, profile_id, display_name, root_path, default_branch, health]
      properties:
        id: {type: string}
        profile_id: {type: string}
        display_name: {type: string}
        root_path: {type: string}
        origin_url: {type: string}
        default_branch: {type: string}
        primary_branch: {type: string}
        primary_head: {$ref: '#/components/schemas/GitSha'}
        primary_clean: {type: boolean}
        health: {enum: [ready, blocked, degraded]}
        blockers:
          type: array
          items: {type: string}
        managed_worktree_count: {type: integer}
        authority_digest: {type: string}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [repository_id, objective, mode]
      properties:
        repository_id: {type: string}
        objective: {type: string, minLength: 1, maxLength: 50000}
        title: {type: string, maxLength: 240}
        base_ref: {type: string, default: origin/main}
        mode: {enum: [plan_only, plan_and_implement]}
        publication: {enum: [local_only, draft_pr_after_approval], default: local_only}
        run_token_budget: {type: integer, minimum: 500000, maximum: 1000000000}
        governor_model: {enum: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]}
        governor_reasoning_effort: {enum: [low, medium, high, xhigh, max]}
        automatic_plan_approval: {type: boolean, default: false}
        codex_account_id: {type: [string, 'null']}
        deep_interview:
          type: boolean
          default: false
          description: Pause before architecture for a human-confirmed intent interview.
    Run:
      type: object
      additionalProperties: false
      required: [id, repository_id, title, objective, mode, publication_mode, state, phase, base_ref, base_sha, authority_digest, created_at, scheduler_paused, version]
      properties:
        id: {type: string}
        repository_id: {type: string}
        title: {type: string}
        objective: {type: string}
        mode: {enum: [plan_only, plan_and_implement]}
        publication_mode: {enum: [local_only, draft_pr_after_approval]}
        state: {type: string}
        phase: {type: string}
        base_ref: {type: string}
        base_sha: {$ref: '#/components/schemas/GitSha'}
        integration_branch: {type: string}
        integration_sha: {$ref: '#/components/schemas/GitSha'}
        authority_digest: {type: string}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        scheduler_paused: {type: boolean}
        run_token_budget: {type: integer, minimum: 500000, maximum: 1000000000}
        version: {type: integer}
    IntentBrief:
      type: object
      additionalProperties: false
      required: [refined_objective, intended_final_shape, hard_constraints, preferences, non_goals, acceptance_examples, planner_may_decide, assumptions_to_validate]
      properties:
        refined_objective: {type: string, minLength: 1, maxLength: 12000}
        intended_final_shape: {$ref: '#/components/schemas/IntentBriefItems'}
        hard_constraints: {$ref: '#/components/schemas/IntentBriefItems'}
        preferences: {$ref: '#/components/schemas/IntentBriefItems'}
        non_goals: {$ref: '#/components/schemas/IntentBriefItems'}
        acceptance_examples: {$ref: '#/components/schemas/IntentBriefItems'}
        planner_may_decide: {$ref: '#/components/schemas/IntentBriefItems'}
        assumptions_to_validate: {$ref: '#/components/schemas/IntentBriefItems'}
    IntentBriefItems:
      type: array
      maxItems: 32
      items: {type: string, minLength: 1, maxLength: 4000}
    IntentInterview:
      type: object
      additionalProperties: false
      required: [schema, status, agent_id, turn_count, messages, draft_brief, draft_digest, confirmed_brief, confirmed_digest, started_at, updated_at, confirmed_at, skipped_at, last_error]
      properties:
        schema: {const: harness.intent-interview.v1}
        status: {enum: [not_started, running, waiting_for_human, ready_for_confirmation, confirmed, skipped, failed]}
        agent_id: {type: [string, 'null']}
        turn_count: {type: integer, minimum: 0}
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, kind, text, why_it_matters, recorded_at]
            properties:
              role: {enum: [human, interviewer]}
              kind: {enum: [question, answer, direction, brief_ready]}
              text: {type: string}
              why_it_matters: {type: [string, 'null']}
              recorded_at: {type: string, format: date-time}
        draft_brief:
          anyOf:
            - {$ref: '#/components/schemas/IntentBrief'}
            - {type: 'null'}
        draft_digest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        confirmed_brief:
          anyOf:
            - {$ref: '#/components/schemas/IntentBrief'}
            - {type: 'null'}
        confirmed_digest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        started_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
        confirmed_at: {type: [string, 'null'], format: date-time}
        skipped_at: {type: [string, 'null'], format: date-time}
        last_error: {type: [string, 'null']}
    PlanReviewFinding:
      type: object
      additionalProperties: false
      required: [severity, file, line, description, required_correction]
      properties:
        severity: {enum: [blocking, advisory]}
        file: {type: [string, 'null']}
        line: {type: [integer, 'null']}
        description: {type: string, minLength: 1, maxLength: 8000}
        required_correction: {type: string, minLength: 1, maxLength: 8000}
    PlanReviewEvidence:
      type: object
      additionalProperties: false
      required: [inspected_files, critical_path, failure_modes]
      properties:
        inspected_files: {type: array, minItems: 1, items: {type: string}}
        critical_path:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [task_id, why_critical, behavioral_proof]
            properties:
              task_id: {type: string}
              why_critical: {type: string}
              behavioral_proof: {type: string}
        failure_modes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [failure_mode, mitigation]
            properties:
              failure_mode: {type: string}
              mitigation: {type: string}
    PlanCertificate:
      type: object
      additionalProperties: false
      required: [schema, run_id, revision, plan_digest, base_sha, profile_digest, authority_digest, reviewer_agent_id, reviewer, summary, evidence, advisory_findings, budget, risk, automatic_approval_eligible, automatic_approval_blockers, certified_at]
      properties:
        schema: {const: harness.plan-certificate.v2}
        run_id: {type: string}
        revision: {type: integer}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        base_sha: {$ref: '#/components/schemas/GitSha'}
        profile_digest: {type: string}
        authority_digest: {type: string}
        intent_brief_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        reviewer_agent_id: {type: string}
        reviewer: {type: object}
        summary: {type: string}
        evidence: {$ref: '#/components/schemas/PlanReviewEvidence'}
        advisory_findings: {type: array, items: {$ref: '#/components/schemas/PlanReviewFinding'}}
        budget: {type: object}
        risk: {type: object}
        automatic_approval_eligible: {type: boolean}
        automatic_approval_blockers: {type: array, items: {type: string}}
        certified_at: {type: string, format: date-time}
    PlanReviewRecord:
      type: object
      additionalProperties: false
      required: [revision, plan_digest, source, verdict, summary, findings, blocking_count, recorded_at]
      properties:
        revision: {type: integer}
        plan_digest: {type: string}
        source: {enum: [agent, human]}
        reviewer_agent_id: {type: [string, 'null']}
        verdict: {enum: [accept, changes_requested]}
        summary: {type: string}
        findings: {type: array, items: {$ref: '#/components/schemas/PlanReviewFinding'}}
        evidence:
          anyOf:
            - {$ref: '#/components/schemas/PlanReviewEvidence'}
            - {type: 'null'}
        blocking_fingerprint: {type: [string, 'null']}
        blocking_count: {type: integer}
        recorded_at: {type: string, format: date-time}
    SignoffPacket:
      type: object
      additionalProperties: false
      required: [schema, packet_digest, run_id, objective, plan_digest, plan_revision, plan_review_history, integration_sha, profile_digest, authority_digest, task_reviews, integration_validation, acceptance, exact_head_evidence, unproved_claims, total_tokens_used]
      properties:
        schema: {const: harness-signoff-packet/v1}
        packet_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        run_id: {type: string}
        objective: {type: string}
        intent_brief:
          anyOf:
            - {$ref: '#/components/schemas/IntentBrief'}
            - {type: 'null'}
        intent_brief_digest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        plan_revision: {type: integer}
        plan_review_history: {type: array, items: {$ref: '#/components/schemas/PlanReviewRecord'}}
        integration_sha: {$ref: '#/components/schemas/GitSha'}
        profile_digest: {type: string}
        authority_digest: {type: string}
        task_reviews: {type: array, items: {type: object}}
        integration_validation: {type: object}
        acceptance:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, required, status, instructions, proof_tier]
            properties:
              id: {type: string}
              kind: {enum: [automated, attested]}
              required: {type: boolean}
              status: {enum: [not_selected, passed, failed, pending_attestation, attested]}
              instructions: {type: string}
              proof_tier: {type: string}
              result: {type: [object, 'null']}
              attestation: {type: [object, 'null']}
        exact_head_evidence: {type: array, items: {type: object}}
        unproved_claims: {type: array, items: {type: string}}
        total_tokens_used: {type: integer}
        final_audit: {type: [object, 'null']}
        human_decision: {type: [object, 'null']}
    RunDetail:
      type: object
      additionalProperties: false
      required: [run, intent_interview, tasks, agents, worktrees, approvals, plan_review_history, planning_tokens_used, signoff_packet, draft_pr_ci, automatic_plan_approval]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        intent_interview:
          anyOf:
            - {$ref: '#/components/schemas/IntentInterview'}
            - {type: 'null'}
        tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
        agents: {type: array, items: {$ref: '#/components/schemas/AgentSummary'}}
        worktrees: {type: array, items: {$ref: '#/components/schemas/Worktree'}}
        approvals: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        plan: {type: object}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        plan_certificate:
          anyOf:
            - {$ref: '#/components/schemas/PlanCertificate'}
            - {type: 'null'}
        plan_review_history: {type: array, items: {$ref: '#/components/schemas/PlanReviewRecord'}}
        planning_tokens_used: {type: integer}
        signoff_packet:
          anyOf:
            - {$ref: '#/components/schemas/SignoffPacket'}
            - {type: 'null'}
        draft_pr_ci: {type: [object, 'null']}
        automatic_plan_approval: {type: boolean}
        preferred_codex_account_id: {type: [string, 'null']}
    RunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        next_cursor: {type: string}
    Task:
      type: object
      additionalProperties: false
      required: [id, run_id, external_task_id, title, objective, state, attempt, base_sha, version]
      properties:
        id: {type: string}
        run_id: {type: string}
        external_task_id: {type: string}
        title: {type: string}
        objective: {type: string}
        state: {type: string}
        priority: {type: string}
        owner_profile: {type: string}
        reviewer_profile: {type: string}
        attempt: {type: integer}
        base_sha: {$ref: '#/components/schemas/GitSha'}
        head_sha: {$ref: '#/components/schemas/GitSha'}
        token_budget: {type: integer}
        dependencies:
          type: array
          items: {type: string}
        version: {type: integer}
    TaskDetail:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        attempt_packet:
          description: Current attempt id and immutable task packet, or null before dispatch.
    AgentSummary:
      type: object
      additionalProperties: false
      required: [id, role, state, requested_model, requested_reasoning_effort, cwd]
      properties:
        id: {type: string}
        codex_account_id: {type: [string, 'null']}
        parent_agent_id: {type: string}
        task_id: {type: string}
        role: {type: string}
        nickname: {type: string}
        state: {type: string}
        requested_model: {type: string}
        effective_model: {type: string}
        requested_reasoning_effort: {type: string}
        effective_reasoning_effort: {type: string}
        sandbox_mode: {type: string}
        cwd: {type: string}
        current_goal: {type: string}
        current_action: {type: string}
        token_budget: {type: integer}
        tokens_used: {type: integer}
        estimated_cost_lower: {type: string}
        estimated_cost_upper: {type: string}
        heartbeat_at: {type: string, format: date-time}
        thread_id: {type: string}
        active_turn_id: {type: string}
        active_turn_started_at: {type: [string, 'null'], format: date-time}
        active_turn_usage:
          anyOf:
            - {$ref: '#/components/schemas/TokenUsage'}
            - {type: 'null'}
        context_strategy: {type: string, enum: [fresh_independent, bounded_handoff]}
        context_source_attempt_id: {type: string}
        context_reuse_reason: {type: string}
        version: {type: integer}
    AgentDetail:
      allOf:
        - {$ref: '#/components/schemas/AgentSummary'}
        - type: object
          properties:
            thread_id: {type: string}
            active_turn_id: {type: string}
            worktree: {$ref: '#/components/schemas/Worktree'}
            children:
              type: array
              items: {$ref: '#/components/schemas/AgentSummary'}
            usage: {$ref: '#/components/schemas/UsageSummary'}
            context: {type: object}
            version: {type: integer}
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ActivityItem'}
        next_cursor: {type: integer}
        latest_message:
          anyOf:
            - {$ref: '#/components/schemas/LatestAgentMessage'}
            - {type: 'null'}
        messages:
          type: array
          description: Up to 100 recent completed agent messages in chronological order.
          items: {$ref: '#/components/schemas/LatestAgentMessage'}
    ActivityItem:
      type: object
      additionalProperties: false
      required: [id, sequence, kind, state, occurred_at]
      properties:
        id: {type: string}
        sequence: {type: integer}
        kind: {type: string}
        state: {type: string}
        summary: {type: string}
        payload: {type: object}
        occurred_at: {type: string, format: date-time}
    LatestAgentMessage:
      type: object
      additionalProperties: false
      required: [id, text, occurred_at]
      properties:
        id: {type: string}
        text: {type: string}
        phase: {type: string}
        occurred_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, run_id, thread_id, approval_type, risk_level, request, state, created_at, version]
      properties:
        id: {type: string}
        run_id: {type: string}
        agent_id: {type: string}
        task_id: {type: string}
        thread_id: {type: string}
        turn_id: {type: string}
        approval_type: {type: string}
        risk_level: {enum: [low, medium, high, critical]}
        request: {type: object}
        state: {enum: [pending, delivering, resolved, expired]}
        decision: {type: string}
        created_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}
        version: {type: integer}
    Worktree:
      type: object
      additionalProperties: false
      required: [id, kind, path, base_sha, state]
      properties:
        id: {type: string}
        run_id: {type: string}
        task_id: {type: string}
        kind: {enum: [inspection, task, verifier, integration]}
        path: {type: string}
        branch: {type: string}
        base_sha: {$ref: '#/components/schemas/GitSha'}
        head_sha: {$ref: '#/components/schemas/GitSha'}
        state: {type: string}
        preserved_reason: {type: string}
        dirty: {type: boolean}
        files_changed: {type: integer}
        additions: {type: integer}
        deletions: {type: integer}
        version: {type: integer}
    WorktreeDiffSummary:
      type: object
      additionalProperties: false
      required: [worktree_id, state, dirty, head_changed, files_changed, additions, deletions, changed_paths, changed_paths_truncated]
      properties:
        worktree_id: {type: string}
        state: {enum: [clean, uncommitted, committed, committed_and_uncommitted]}
        dirty: {type: boolean}
        head_changed: {type: boolean}
        files_changed: {type: integer}
        additions: {type: integer}
        deletions: {type: integer}
        changed_paths:
          type: array
          maxItems: 200
          items: {type: string}
        changed_paths_truncated: {type: boolean}
    Finding:
      type: object
      additionalProperties: false
      required: [id, severity, title, status]
      properties:
        id: {type: string}
        severity: {enum: [critical, high, medium, low]}
        title: {type: string}
        invariant: {type: string}
        file: {type: string}
        line: {type: integer}
        details: {type: string}
        required_correction: {type: string}
        status: {enum: [open, accepted, fixed, rejected_with_rationale]}
    Validation:
      type: object
      additionalProperties: false
      required: [id, validator_id, proof_tier, source_sha, state]
      properties:
        id: {type: string}
        validator_id: {type: string}
        proof_tier: {enum: [T0, T1, T2, T3, T4, T5, T6]}
        source_sha: {$ref: '#/components/schemas/GitSha'}
        state: {type: string}
        result_class:
          enum: [success, not_selected, source_failure, infrastructure_unavailable, inconclusive, cancelled_superseded, skipped_draft, quarantined_failure]
        command_run_id: {type: string}
        evidence_ids:
          type: array
          items: {type: string}
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [schema, run, tasks, agents, evidence, artifacts]
      properties:
        schema: {const: harness-evidence-snapshot/v1}
        run: {$ref: '#/components/schemas/Run'}
        tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
        agents: {type: array, items: {$ref: '#/components/schemas/AgentSummary'}}
        evidence:
          type: array
          items: {type: object}
        artifacts:
          type: array
          items: {type: object}
    UsageSummary:
      type: object
      additionalProperties: false
      required: [input_tokens, cached_input_tokens, output_tokens, reasoning_output_tokens, total_tokens, cost, by_model]
      properties:
        input_tokens: {type: integer}
        cached_input_tokens: {type: integer}
        cache_write_input_tokens: {type: integer}
        output_tokens: {type: integer}
        reasoning_output_tokens: {type: integer}
        total_tokens: {type: integer}
        cost:
          $ref: '#/components/schemas/CostEstimate'
        by_model:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [model, turns, usage, cost]
            properties:
              model: {type: string}
              turns: {type: integer}
              usage: {$ref: '#/components/schemas/TokenUsage'}
              cost: {$ref: '#/components/schemas/CostEstimate'}
    TokenUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, cached_input_tokens, output_tokens, reasoning_output_tokens, total_tokens]
      properties:
        input_tokens: {type: integer}
        cached_input_tokens: {type: integer}
        cache_write_input_tokens: {type: integer}
        output_tokens: {type: integer}
        reasoning_output_tokens: {type: integer}
        total_tokens: {type: integer}
        model_context_window: {type: integer}
    UsageBreakdown:
      type: object
      additionalProperties: false
      required: [total, by_account, by_repository, by_agent]
      properties:
        total: {$ref: '#/components/schemas/UsageSummary'}
        by_account: {type: array, items: {$ref: '#/components/schemas/UsageGroup'} }
        by_repository: {type: array, items: {$ref: '#/components/schemas/UsageGroup'} }
        by_agent: {type: array, items: {$ref: '#/components/schemas/UsageGroup'} }
    UsageGroup:
      type: object
      additionalProperties: false
      required: [id, label, detail, turns, usage, cost]
      properties:
        id: {type: string}
        label: {type: string}
        detail: {type: string}
        turns: {type: integer, minimum: 0}
        usage: {$ref: '#/components/schemas/TokenUsage'}
        cost: {$ref: '#/components/schemas/CostEstimate'}
    CostEstimate:
      type: object
      additionalProperties: false
      required: [lower_microusd, upper_microusd, confidence, pricing_snapshot_ids, explanation]
      properties:
        lower_microusd: {type: integer}
        upper_microusd: {type: integer}
        confidence: {enum: [exact, bounded, unknown]}
        pricing_snapshot_ids: {type: array, items: {type: string}}
        explanation: {type: string}
    ValidationOutcome:
      type: object
      additionalProperties: false
      required: [validation_id, command_id, validator_id, source_sha, proof_tier, result]
      properties:
        validation_id: {type: string}
        command_id: {type: string}
        validator_id: {type: string}
        source_sha: {$ref: '#/components/schemas/GitSha'}
        proof_tier: {enum: [T0, T1, T2, T3, T4, T5, T6]}
        result: {type: object}
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, state, target_id]
      properties:
        operation_id: {type: string}
        state: {const: accepted}
        target_id: {type: string}
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
