        proposal_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        dedupe_key: {type: string}
        state: {enum: [PROPOSED, POLICY_ACCEPTED, POLICY_REJECTED, EXECUTING, SUCCEEDED, FAILED, STALE, CANCELED]}
        policy_reason: {type: [string, 'null']}
        execution_receipt: {type: [object, 'null']}
        execution_receipt_sha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        created_at: {type: string, format: date-time}
        evaluated_at: {type: [string, 'null'], format: date-time}
        execution_started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
    ExpertRequest:
      type: object
      additionalProperties: false
      required: [id, action_id, decision_id, run_id, snapshot_id, signature, state, payload, payload_sha256, requested_model, requested_effort, expires_at, created_at, started_at, completed_at, failure_reason, agent_session_id]
      properties:
        id: {type: string}
        action_id: {type: string}
        decision_id: {type: string}
        run_id: {type: string}
        snapshot_id: {type: string}
        signature: {type: string, pattern: '^[0-9a-f]{64}$'}
        state: {enum: [QUEUED, RUNNING, COMPLETED, FAILED, INCONCLUSIVE, CANCELED, STALE]}
        payload: {type: object}
        payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        requested_model: {type: string}
        requested_effort: {type: string}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        failure_reason: {type: [string, 'null']}
        agent_session_id: {type: [string, 'null']}
    RunDetail:
      type: object
      additionalProperties: false
      required: [run, intent_interview, tasks, agents, worktrees, approvals, plan_review_history, planning_tokens_used, signoff_packet, draft_pr_ci, automatic_plan_approval, governor_progress, supervision_mode, supervisor_snapshot, supervisor_review, supervisor_decision, supervisor_actions, expert_requests]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        intent_interview:
          anyOf:
            - {$ref: '#/components/schemas/IntentInterview'}
            - {type: 'null'}
        tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
        agents: {type: array, items: {$ref: '#/components/schemas/AgentSummary'}}
        worktrees: {type: array, items: {$ref: '#/components/schemas/Worktree'}}
        approvals: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        plan: {type: object}
        plan_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        plan_certificate:
          anyOf:
            - {$ref: '#/components/schemas/PlanCertificate'}
            - {type: 'null'}
        plan_review_history: {type: array, items: {$ref: '#/components/schemas/PlanReviewRecord'}}
        planning_tokens_used: {type: integer}
        signoff_packet:
          anyOf:
            - {$ref: '#/components/schemas/SignoffPacket'}
            - {type: 'null'}
        draft_pr_ci: {type: [object, 'null']}
        automatic_plan_approval: {type: boolean}
        preferred_codex_account_id: {type: [string, 'null']}
        governor_progress:
          type: object
          additionalProperties: {}
        supervision_mode: {$ref: '#/components/schemas/SupervisorMode'}
        supervisor_snapshot:
          anyOf:
            - {$ref: '#/components/schemas/SupervisorSnapshot'}
            - {type: 'null'}
        supervisor_review:
          anyOf:
            - {$ref: '#/components/schemas/SupervisorReview'}
            - {type: 'null'}
        supervisor_decision:
          anyOf:
            - {$ref: '#/components/schemas/SupervisorDecision'}
            - {type: 'null'}
        supervisor_actions: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SupervisorAction'}}
        expert_requests: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ExpertRequest'}}
    RunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        next_cursor: {type: string}
    Task:
      type: object
      additionalProperties: false
      required: [id, run_id, external_task_id, title, objective, state, attempt, base_sha, version]
      properties:
        id: {type: string}
        run_id: {type: string}
        external_task_id: {type: string}
        title: {type: string}
        objective: {type: string}
        state: {type: string}
        priority: {type: string}
        owner_profile: {type: string}
        reviewer_profile: {type: string}
        attempt: {type: integer}
        base_sha: {$ref: '#/components/schemas/GitSha'}
        head_sha: {$ref: '#/components/schemas/GitSha'}
        token_budget: {type: integer}
        dependencies:
          type: array
          items: {type: string}
        version: {type: integer}
    TaskDetail:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        attempt_packet:
          description: Current attempt id and immutable task packet, or null before dispatch.
    AgentSummary:
      type: object
      additionalProperties: false
      required: [id, role, state, requested_model, requested_reasoning_effort, cwd]
      properties:
        id: {type: string}
        codex_account_id: {type: [string, 'null']}
        parent_agent_id: {type: string}
        task_id: {type: string}
        role: {type: string}
        nickname: {type: string}
        state: {type: string}
        requested_model: {type: string}
        effective_model: {type: string}
        requested_reasoning_effort: {type: string}
        effective_reasoning_effort: {type: string}
        sandbox_mode: {type: string}
        cwd: {type: string}
        current_goal: {type: string}
        current_action: {type: string}
        token_budget: {type: integer}
        tokens_used: {type: integer}
        estimated_cost_lower: {type: string}
        estimated_cost_upper: {type: string}
        heartbeat_at: {type: string, format: date-time}
        thread_id: {type: string}
        active_turn_id: {type: string}
        active_turn_started_at: {type: [string, 'null'], format: date-time}
        active_turn_usage:
          anyOf:
            - {$ref: '#/components/schemas/TokenUsage'}
            - {type: 'null'}
        context_strategy: {type: string, enum: [fresh_independent, bounded_handoff]}
        context_source_attempt_id: {type: string}
        context_reuse_reason: {type: string}
        version: {type: integer}
    AgentDetail:
      allOf:
        - {$ref: '#/components/schemas/AgentSummary'}
        - type: object
          properties:
            thread_id: {type: string}
            active_turn_id: {type: string}
            worktree: {$ref: '#/components/schemas/Worktree'}
            children:
              type: array
              items: {$ref: '#/components/schemas/AgentSummary'}
            usage: {$ref: '#/components/schemas/UsageSummary'}
            context: {type: object}
            version: {type: integer}
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ActivityItem'}
        next_cursor: {type: integer}
        latest_message:
          anyOf:
            - {$ref: '#/components/schemas/LatestAgentMessage'}
            - {type: 'null'}
        messages:
          type: array
          description: Up to 100 recent completed agent messages in chronological order.
          items: {$ref: '#/components/schemas/LatestAgentMessage'}
    ActivityItem:
      type: object
      additionalProperties: false
      required: [id, sequence, kind, state, occurred_at]
      properties:
        id: {type: string}
        sequence: {type: integer}
        kind: {type: string}
        state: {type: string}
        summary: {type: string}
        payload: {type: object}
        occurred_at: {type: string, format: date-time}
    LatestAgentMessage:
      type: object
      additionalProperties: false
      required: [id, text, occurred_at]
      properties:
        id: {type: string}
        text: {type: string}
        phase: {type: string}
        occurred_at: {type: string, format: date-time}
    Approval:
      type: object
      additionalProperties: false
      required: [id, run_id, thread_id, approval_type, risk_level, request, state, created_at, version]
      properties:
        id: {type: string}
        run_id: {type: string}
        agent_id: {type: string}
        task_id: {type: string}
        thread_id: {type: string}
        turn_id: {type: string}
        approval_type: {type: string}
        risk_level: {enum: [low, medium, high, critical]}
        request: {type: object}
        state: {enum: [pending, delivering, resolved, expired]}
        decision: {type: string}
        created_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}
        version: {type: integer}
    Worktree:
      type: object
      additionalProperties: false
      required: [id, kind, path, base_sha, state]
      properties:
        id: {type: string}
        run_id: {type: string}
        task_id: {type: string}
        kind: {enum: [inspection, task, verifier, integration]}
        path: {type: string}
        branch: {type: string}
        base_sha: {$ref: '#/components/schemas/GitSha'}
        head_sha: {$ref: '#/components/schemas/GitSha'}
        state: {type: string}
        preserved_reason: {type: string}
        dirty: {type: boolean}
        files_changed: {type: integer}
        additions: {type: integer}
        deletions: {type: integer}
        version: {type: integer}
    WorktreeDiffSummary:
      type: object
      additionalProperties: false
      required: [worktree_id, state, dirty, head_changed, files_changed, additions, deletions, changed_paths, changed_paths_truncated]
      properties:
        worktree_id: {type: string}
        state: {enum: [clean, uncommitted, committed, committed_and_uncommitted]}
        dirty: {type: boolean}
        head_changed: {type: boolean}
        files_changed: {type: integer}
        additions: {type: integer}
        deletions: {type: integer}
        changed_paths:
          type: array
          maxItems: 200
          items: {type: string}
        changed_paths_truncated: {type: boolean}
    Finding:
      type: object
      additionalProperties: false
      required: [id, severity, title, status]
      properties:
        id: {type: string}
        severity: {enum: [critical, high, medium, low]}
        title: {type: string}
        invariant: {type: string}
        file: {type: string}
        line: {type: integer}
        details: {type: string}
        required_correction: {type: string}
        status: {enum: [open, accepted, fixed, rejected_with_rationale]}
    Validation:
      type: object
      additionalProperties: false
      required: [id, validator_id, proof_tier, source_sha, state]
      properties:
        id: {type: string}
        validator_id: {type: string}
        proof_tier: {enum: [T0, T1, T2, T3, T4, T5, T6]}
        source_sha: {$ref: '#/components/schemas/GitSha'}
        state: {type: string}
        result_class:
          enum: [success, not_selected, source_failure, infrastructure_unavailable, inconclusive, cancelled_superseded, skipped_draft, quarantined_failure]
        command_run_id: {type: string}
        evidence_ids:
          type: array
          items: {type: string}
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [schema, run, tasks, agents, evidence, artifacts]
      properties:
        schema: {const: harness-evidence-snapshot/v1}
        run: {$ref: '#/components/schemas/Run'}
        tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
        agents: {type: array, items: {$ref: '#/components/schemas/AgentSummary'}}
        evidence:
          type: array
          items: {type: object}
        artifacts:
          type: array
          items: {type: object}
    UsageSummary:
      type: object
      additionalProperties: false
      required: [input_tokens, cached_input_tokens, output_tokens, reasoning_output_tokens, total_tokens, cost, by_model]
      properties:
        input_tokens: {type: integer}
        cached_input_tokens: {type: integer}
        cache_write_input_tokens: {type: integer}
        output_tokens: {type: integer}
        reasoning_output_tokens: {type: integer}
        total_tokens: {type: integer}
        cost:
          $ref: '#/components/schemas/CostEstimate'
        by_model:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [model, turns, usage, cost]
            properties:
              model: {type: string}
              turns: {type: integer}
              usage: {$ref: '#/components/schemas/TokenUsage'}
              cost: {$ref: '#/components/schemas/CostEstimate'}
    TokenUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, cached_input_tokens, output_tokens, reasoning_output_tokens, total_tokens]
      properties:
        input_tokens: {type: integer}
        cached_input_tokens: {type: integer}
        cache_write_input_tokens: {type: integer}
        output_tokens: {type: integer}
        reasoning_output_tokens: {type: integer}
        total_tokens: {type: integer}
        model_context_window: {type: integer}
    UsageBreakdown:
      type: object
      additionalProperties: false
      required: [total, by_account, by_repository, by_agent]
      properties:
        total: {$ref: '#/components/schemas/UsageSummary'}
        by_account: {type: array, items: {$ref: '#/components/schemas/UsageGroup'} }
        by_repository: {type: array, items: {$ref: '#/components/schemas/UsageGroup'} }
        by_agent: {type: array, items: {$ref: '#/components/schemas/UsageGroup'} }
    UsageGroup:
      type: object
      additionalProperties: false
      required: [id, label, detail, turns, usage, cost]
      properties:
        id: {type: string}
        label: {type: string}
        detail: {type: string}
        turns: {type: integer, minimum: 0}
        usage: {$ref: '#/components/schemas/TokenUsage'}
        cost: {$ref: '#/components/schemas/CostEstimate'}
    CostEstimate:
      type: object
      additionalProperties: false
      required: [lower_microusd, upper_microusd, confidence, pricing_snapshot_ids, explanation]
      properties:
        lower_microusd: {type: integer}
        upper_microusd: {type: integer}
        confidence: {enum: [exact, bounded, unknown]}
        pricing_snapshot_ids: {type: array, items: {type: string}}
        explanation: {type: string}
    ValidationOutcome:
      type: object
      additionalProperties: false
      required: [validation_id, command_id, validator_id, source_sha, proof_tier, result]
      properties:
        validation_id: {type: string}
        command_id: {type: string}
        validator_id: {type: string}
        source_sha: {$ref: '#/components/schemas/GitSha'}
        proof_tier: {enum: [T0, T1, T2, T3, T4, T5, T6]}
        result: {type: object}
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, state, target_id]
      properties:
        operation_id: {type: string}
        state: {const: accepted}
        target_id: {type: string}
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
