        outcome_id: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
        run_id: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
        subject: {$ref: '#/components/schemas/OutcomeSubject'}
        dimension: {$ref: '#/components/schemas/OutcomeDimension'}
        classification: {$ref: '#/components/schemas/OutcomeClassification'}
        code: {type: string, pattern: '^[a-z0-9_]{1,80}$'}
        observed_at: {type: integer, minimum: 0}
        confidence: {enum: [authoritative, operator_asserted]}
        source: {$ref: '#/components/schemas/OutcomeSource'}
        supersedes: {type: array, uniqueItems: true, items: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}}
        reason_code: {type: [string, 'null'], pattern: '^[a-z0-9_]{1,80}$'}
        correction_artifact_id: {type: [string, 'null'], pattern: '^[A-Za-z0-9_.-]{1,128}$'}
        redactor_version: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
        free_text_redacted: {type: boolean}
      allOf:
        - $ref: '#/components/schemas/OutcomeLabel'
        - if: {properties: {dimension: {const: validation}}}
          then: {properties: {confidence: {const: authoritative}, source: {properties: {kind: {const: validation}}}}}
        - if: {properties: {dimension: {const: evidence}}}
          then: {properties: {confidence: {const: authoritative}, source: {properties: {kind: {const: evidence}}}}}
        - if: {properties: {dimension: {const: verifier_findings}}}
          then: {properties: {confidence: {const: authoritative}, source: {properties: {kind: {enum: [finding, domain_event]}}}}}
        - if: {properties: {dimension: {const: completion_state}}}
          then: {properties: {confidence: {const: authoritative}, source: {properties: {kind: {const: domain_event}}}}}
        - if: {properties: {dimension: {const: resource_use}}}
          then: {properties: {confidence: {const: authoritative}, source: {properties: {kind: {const: domain_event}}}}}
        - if: {properties: {dimension: {const: ci_required_checks}}}
          then: {properties: {confidence: {const: authoritative}, source: {properties: {kind: {enum: [validation, evidence]}}}}}
        - if: {properties: {dimension: {enum: [operator_acceptance, operator_correction, review_regression, pr_reopened, rollback, downstream_regression]}}}
          then: {properties: {confidence: {const: operator_asserted}, source: {properties: {kind: {const: human_action}}}}}
