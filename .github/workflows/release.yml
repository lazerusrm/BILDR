name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release metadata and version
        run: |
          git log -1 --format=%B | bash .github/scripts/check-contribution-metadata.sh
          bash .github/scripts/check-repository-policy.sh
          test "v$(tr -d '\n' < VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-release-
      - name: Install Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libappindicator3-dev
      - name: Build verified distribution
        run: |
          npm --prefix ui ci
          cargo xtask check
          cargo xtask dist
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/bildr-*.tar.gz
          dist/bildr-*.tar.gz.sha256
          --generate-notes
          --title "$GITHUB_REF_NAME"
