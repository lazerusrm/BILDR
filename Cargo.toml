[workspace]
resolver = "3"
members = [
    "crates/harness-domain",
    "crates/harness-store",
    "crates/harness-codex",
    "crates/harness-profile",
    "crates/harness-git",
    "crates/harness-runner",
    "crates/harness-context",
    "crates/harness-orchestrator",
    "crates/harness-evidence",
    "crates/harness-usage",
    "crates/harness-trace",
    "crates/harness-learning",
    "crates/harness-api",
    "bins/harnessd",
    "bins/harnessctl",
    "bins/harness-probe",
    "bins/fake-app-server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/lazerusrm/BILDR"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3.6"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "tokio"] }
base64 = "0.22"
bytes = "1.11"
clap = { version = "4.6.5", features = ["derive", "env"] }
futures = "0.3"
fs2 = "0.4.3"
globset = "0.4"
hex = "0.4"
http = "1.4"
jsonschema = { version = "0.49.9", default-features = false }
mime_guess = "2.0"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
rustix = { version = "1.1.4", features = ["process"] }
rust-embed = { version = "8.12.0", features = ["compression", "include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11.0"
subtle = "2.6"
tar = "0.4"
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1.4"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["compression-full", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = { version = "3.0.0", features = ["serde"] }
url = "2.5"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
walkdir = "2.5"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
