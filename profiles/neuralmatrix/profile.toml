schema_version = 1
profile_id = "neuralmatrix"
display_name = "NeuralMatrix"
repository = "lazerusrm/NeuralMatrix"
default_branch = "main"
base_ref = "origin/main"

# Runtime state is not completion authority. The profile must never create a
# second release/completion ledger beside the repository's canonical checklist.
completion_authority = "docs/architecture/MASTER_COMPLETION_CHECKLIST.md"

instruction_sources = [
  "AGENTS.md",
  "CODEX.md",
  "docs/README.md",
  "docs/INDEX_FOR_AGENTS.md",
  "docs/architecture/CANONICAL_INDEX.md",
]

required_global_authorities = [
  "docs/product/NEURALMATRIX_PRODUCT_CONTRACT.md",
  "docs/architecture/PRODUCT_ARCHITECTURE_CONTRACT.md",
  "docs/architecture/CANONICAL_AUTHORITY_DOCTRINE.md",
  "docs/architecture/ENGINEERING_GOVERNANCE_CONTRACT.md",
  "docs/architecture/CI_TEST_ARCHITECTURE.md",
  "docs/architecture/MASTER_COMPLETION_CHECKLIST.md",
]

protected_semantics = [
  "single canonical producer and consumer contract",
  "fail closed when canonical truth or required proof is missing",
  "no compatibility aliases or accept-both decoders",
  "no broad normalization or translation shims",
  "no latest-frame, stale-cache, raw-id, URL, binding, or client repair",
  "no semantic or protocol fallback",
  "exact-head evidence",
  "no AI attribution or co-author trailers in commits",
]

serial_paths = [
  "AGENTS.md",
  "CODEX.md",
  "docs/architecture/CANONICAL_INDEX.md",
  "docs/architecture/MASTER_COMPLETION_CHECKLIST.md",
  "docs/architecture/**",
  "shared/**/generated/**",
  "**/migrations/**",
  "**/Cargo.lock",
  ".github/workflows/**",
  "tools/ci/ci_test_claims.v1.json",
  "tools/ci/ci_workflow_inventory.v1.json",
]

forbidden_generated_runtime_paths = [
  ".omx/**",
  ".harness-runtime/**",
]

[concurrency]
max_total_agent_threads = 6
max_mutable_tasks = 3
max_independent_verifiers = 1
final_integration_mutable_tasks = 1
live_certification_mutable_tasks = 1

[models.architect]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox = "read-only"

[models.explorer]
model = "gpt-5.6-luna"
reasoning_effort = "medium"
sandbox = "read-only"

[models.worker]
model = "gpt-5.6-luna"
reasoning_effort = "max"
sandbox = "workspace-write"

[models.worker_escalation]
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"
sandbox = "workspace-write"

[models.integrator]
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"
sandbox = "workspace-write"

[models.verifier]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox = "read-only"

[models.final_auditor]
model = "gpt-5.6-sol"
reasoning_effort = "max"
sandbox = "read-only"

[[domains]]
id = "edge"
globs = ["edge/**"]
authority_hints = [
  "docs/surfaces/EDGE_STREAMER_CONTRACT.md",
  "docs/architecture/RESOURCE_ROUTE_POLICY.md",
  "docs/architecture/MEDIA_SURFACE_CONTRACT.md",
  "docs/architecture/VIDEO_ANALYTICS_PIPELINE.md",
  "docs/architecture/LIVE_VALIDATION_GATES.md",
]

[[domains]]
id = "c2"
globs = ["central/**"]
authority_hints = [
  "docs/surfaces/C2_CONTRACT.md",
  "docs/security/TENANCY_RBAC_VENDOR_PORTAL_CONTRACT.md",
  "docs/product/SUBSCRIPTION_AND_ENTITLEMENT_CONTRACT.md",
]

[[domains]]
id = "contracts"
globs = ["shared/**", "**/proto/**", "**/schema/**"]
authority_hints = [
  "docs/architecture/CANONICAL_AUTHORITY_DOCTRINE.md",
  "docs/architecture/PRODUCT_EVIDENCE_CONTRACT.md",
]

[[domains]]
id = "dashboard"
globs = ["dashboard/**", "NewDesign/**"]
authority_hints = [
  "docs/product/NEURALMATRIX_PRODUCT_CONTRACT.md",
  "docs/security/TENANCY_RBAC_VENDOR_PORTAL_CONTRACT.md",
]

[[domains]]
id = "ios"
globs = ["ios-native/**"]
authority_hints = [
  "docs/architecture/IOS_REFERENCE_SURFACE_AUDIT.md",
  "docs/architecture/PRODUCT_EVIDENCE_CONTRACT.md",
]

[[domains]]
id = "apex"
globs = ["apex-vms/**"]
authority_hints = [
  "docs/product/NEURALMATRIX_PRODUCT_CONTRACT.md",
  "docs/surfaces/PLAYBACK_MOQ_CONTRACT.md",
]

[[domains]]
id = "hyperwall"
globs = ["hyperwall/**"]
authority_hints = [
  "docs/surfaces/HYPERWALL_CONTRACT.md",
  "docs/architecture/MEDIA_SURFACE_CONTRACT.md",
]

[[domains]]
id = "ci-release"
globs = [".github/**", "tools/ci/**", "infrastructure/**", "deploy/**", "docker/**", "k8s/**", "helm/**", "scripts/**", "ci_scripts/**"]
authority_hints = [
  "docs/architecture/ENGINEERING_GOVERNANCE_CONTRACT.md",
  "docs/architecture/CI_TEST_ARCHITECTURE.md",
  "docs/architecture/OTA_RELEASE_CONTRACT.md",
]

[[validators]]
id = "git-diff-check"
command = ["git", "diff", "--check"]
proof_tier = "T0"
resource_class = "control"

[[validators]]
id = "docs-active-authority-check"
command = ["bash", "-lc", "rg -n 'Use domain contracts|canonical domain contracts' docs --glob '!archive/**' && ! rg -n 'docs/archive/architecture-reset-2026-05-14/CANONICAL_INDEX' docs --glob '!archive/**'"]
proof_tier = "T0"
resource_class = "control"
path_globs = ["docs/**", "AGENTS.md", "CODEX.md"]

[[validators]]
id = "ci-program-selftests"
command = ["bash", "tools/ci/run_ci_test_program_selftests.sh"]
proof_tier = "T1"
resource_class = "medium"
path_globs = [".github/**", "tools/ci/**", "docs/architecture/CI_TEST_ARCHITECTURE.md"]

[[validators]]
id = "local-aarch64-jetson"
command = ["bash", "scripts/run_local_aarch64_cross_build.sh", "--lane", "jetson", "edge"]
proof_tier = "T5"
resource_class = "heavy"
manual_prerequisites = true
path_globs = ["edge/rust-streamer/**", "infrastructure/cross-build/**"]

[[validators]]
id = "local-c2-debian12"
command = ["bash", "scripts/run_local_c2_build.sh"]
proof_tier = "T5"
resource_class = "heavy"
manual_prerequisites = true
path_globs = ["central/rust-c2/**", "infrastructure/c2-build/**"]
